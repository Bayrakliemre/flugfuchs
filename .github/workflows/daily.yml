name: Daily FlugFuchs Update

on:
  schedule:
    # 05:00 UTC ~= 7:00 in Germany (off by one hour during CET winter time,
    # since GitHub Actions cron doesn't support timezones -- a known, harmless
    # drift for a personal deal-check job).
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has_deals: ${{ steps.check.outputs.has_deals }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run FlugFuchs
        env:
          TRAVELPAYOUTS_API_TOKEN: ${{ secrets.TRAVELPAYOUTS_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python main.py

      - name: Check whether any deals were found
        id: check
        run: |
          COUNT=$(python -c "import json; print(len(json.load(open('data/latest_deals.json'))))" 2>/dev/null || echo 0)
          echo "Found $COUNT deals"
          if [ "$COUNT" != "0" ]; then
            echo "has_deals=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_deals=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        if: steps.check.outputs.has_deals == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    if: needs.build.outputs.has_deals == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
